; PlatformIO Project Configuration File
;
; IIoT gateway - network half (ESP32-S3).
; Talks to the STM32 industrial half over UART using the 0xAA/0xBB framed
; protocol implemented in ../ModbusRTU_AWS/Core/Src/esp32msghandler.c
;
; Environments:
;   linkv2                   - bring-up console for the v2 inter-chip link.
;                              No WiFi, no TLS, no credentials, no libraries.
;                              START HERE on new hardware.
;   tbgateway                - ThingsBoard gateway: 4 relays + 4 inputs on the
;                              STM32, published and controlled over MQTT. All
;                              credentials live in NVS, written over USB by
;                              tools/gw_config_tool.py - no secrets.h needed.
;   linktest                 - legacy v1 (0xAA/0xBB) link test, no WiFi/TLS.
;   freenove_esp32_s3_wroom  - full gateway (link + WiFi + AWS IoT MQTT).
;
;   pio run -e linkv2 -t upload -t monitor
;   pio run -e tbgateway -t upload -t monitor
;   pio run -e linktest -t upload -t monitor
;   pio run -e freenove_esp32_s3_wroom -t upload -t monitor

[env]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -Wall

; Two firmwares live in src/: the gateway (main.cpp) and the link bring-up
; console (linkv2_test_main.cpp). Each defines setup() and loop(), so exactly
; one of them can be in any given build - hence the filters below.
;
; The shared protocol header is reached by relative path from include/gw_model.h,
; so there is deliberately no extra -I flag here. See that file for why.

; ---------------------------------------------------------------------------
; linkv2 - the first thing to run on new hardware.
;
; Builds the link module and the test console and nothing else: no cloud
; client, no process image, no tag map, no libraries to download. If this
; environment fails, the problem is the two boards and the cable between them.
;
; Needs the STM32 flashed with GW_LINK_ENABLE 1 (the default) in
; ../ModbusRTU_AWS/Core/Inc/gw_link_cfg.h.
;
; Procedure: docs/LINK_V2_TESTING.html
; ---------------------------------------------------------------------------
[env:linkv2]
build_src_filter =
    +<linkv2_test_main.cpp>
    +<stm_link_v2.cpp>
    +<crc16_modbus.cpp>
build_flags =
    ${env.build_flags}
    -DENABLE_CLOUD=0
    -DLOG_LEVEL=3

; ---------------------------------------------------------------------------
; tbgateway - the ThingsBoard firmware.
;
; Four relays (STM32 PD0..PD3) and four pulled-up inputs (PD4..PD7), published
; as telemetry and switched by RPC from a dashboard.
;
; Needs no secrets.h and no certificates: WiFi credentials and the ThingsBoard
; access token live in NVS and are written over USB serial by
; tools/gw_config_tool.py. That is what makes one binary valid for every unit.
;
; The STM32 must be flashed with GW_LINK_ENABLE 1 and GW_LOCALIO_ENABLE 1
; (ModbusRTU_AWS/Core/Inc/gw_link_cfg.h), which are both the default.
;
; Bring the link up with -e linkv2 first. If ECHO does not round-trip there,
; nothing in this environment can work either, and the failure is easier to read
; without WiFi in the way.
; ---------------------------------------------------------------------------
[env:tbgateway]
build_src_filter =
    +<tb_main.cpp>
    +<tb_client.cpp>
    +<device_config.cpp>
    +<provisioning.cpp>
    +<localio_client.cpp>
    +<stm_link_v2.cpp>
    +<crc16_modbus.cpp>
build_flags =
    ${env.build_flags}
    -DENABLE_CLOUD=1
    -DLOG_LEVEL=3
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    knolleary/PubSubClient@^2.8

[env:linktest]
build_src_filter =
    +<*>
    -<linkv2_test_main.cpp>
    -<tb_main.cpp>
    -<tb_client.cpp>
    -<device_config.cpp>
    -<provisioning.cpp>
    -<localio_client.cpp>
build_flags =
    ${env.build_flags}
    -DENABLE_CLOUD=0

[env:freenove_esp32_s3_wroom]
build_src_filter =
    +<*>
    -<linkv2_test_main.cpp>
    -<tb_main.cpp>
    -<tb_client.cpp>
    -<device_config.cpp>
    -<provisioning.cpp>
    -<localio_client.cpp>
build_flags =
    ${env.build_flags}
    -DENABLE_CLOUD=1
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    knolleary/PubSubClient@^2.8
